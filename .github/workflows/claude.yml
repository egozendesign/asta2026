name: Claude Code Action
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Usa l'abbonamento Claude (Pro/Max) tramite token OAuth.
      # Il token va aggiunto nei Secrets del repo come CLAUDE_CODE_OAUTH_TOKEN
      # (generalo in locale con: claude setup-token). NON scrivere il token qui.
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Review the latest changes in this pull request and output findings."
